# West-sub-sub-2 cluster master config (leaf topology node).

interface: 0.0.0.0
auto_accept: True

topology_enabled: True
cluster_id: west-sub-sub-2
topology_link_port: 4515
topology_handshake_max_tries: 10
topology_handshake_backoff: 2
topology_peers:
  - host: west-sub
    port: 4515

log_level: debug
log_level_logfile: debug
