# East-sub cluster master config (topology-enabled, solo master,
# transit between east and east-sub-sub-{1,2}).

interface: 0.0.0.0
auto_accept: True

topology_enabled: True
cluster_id: east-sub
topology_link_port: 4515
topology_handshake_max_tries: 10
topology_handshake_backoff: 2
topology_peers:
  - host: east
    port: 4515
  - host: east-sub-sub-1
    port: 4515
  - host: east-sub-sub-2
    port: 4515

log_level: debug
log_level_logfile: debug
