# West cluster master config (topology-enabled, solo master)

interface: 0.0.0.0

auto_accept: True

topology_enabled: True
topology_config_file: /etc/salt/topology.conf
topology_link_port: 4515
topology_handshake_max_tries: 10
topology_handshake_backoff: 2

log_level: debug
log_level_logfile: debug
