# East cluster master config (topology-enabled, solo master)
#
# This is a non-3008.x master-cluster master -- `cluster_id` is NOT set
# here; the topology-level cluster identity lives in topology.conf.

interface: 0.0.0.0

# Auto-accept minion keys for smoke testing.  Fine for a sandbox; do
# not use in production.
auto_accept: True

# Topology ------------------------------------------------------------------

topology_enabled: True
topology_config_file: /etc/salt/topology.conf
topology_link_port: 4515
topology_handshake_max_tries: 10
topology_handshake_backoff: 2
# Peer-master keys are pre-exchanged by up.sh before first boot (they
# land in pki/<local>/masters/<peer>.pub, mirroring what `salt-key -a
# <cluster_id> --master` would do by hand).  No `auto_accept_masters`
# toggle because the inbound dispatch does not yet honor it.

# Logging -------------------------------------------------------------------

log_level: debug
log_level_logfile: debug
