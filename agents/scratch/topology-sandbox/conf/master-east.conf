# East cluster master config (topology-enabled, solo master)
#
# `cluster_id` names this master in the topology graph.  Users who
# want this in a separate file can drop it into
# /etc/salt/master.d/ -- Salt's existing include mechanism handles
# the "separate file" case, so topology does not need its own
# loader.

interface: 0.0.0.0
auto_accept: True

topology_enabled: True
cluster_id: east
topology_link_port: 4515
topology_handshake_max_tries: 10
topology_handshake_backoff: 2
topology_peers:
  - host: west
    port: 4515
  - host: east-sub
    port: 4515

# Peer-master keys are pre-exchanged by up.sh before first boot (they
# land in pki/<local>/masters/<peer>.pub, mirroring what
# `salt-key -a <cluster_id> --master` would do by hand).

log_level: debug
log_level_logfile: debug
