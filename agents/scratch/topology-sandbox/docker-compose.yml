    depends_on: [topo-east-sub-sub-2]
    networks: [topo-net]

  topo-east-sub-sub-2-minion-2:
    image: topo-sandbox-salt
    container_name: topo-east-sub-sub-2-minion-2
    hostname: east-sub-sub-2-minion-2
    command: ["salt-minion", "-l", "info"]
    volumes:
