    networks:
      topo-net:
        aliases: [east-sub-sub-1]
    depends_on: [topo-east-sub]

  topo-east-sub-sub-1-minion-1:
    image: topo-sandbox-salt
    container_name: topo-east-sub-sub-1-minion-1
    hostname: east-sub-sub-1-minion-1
    command: ["salt-minion", "-l", "info"]
    volumes:
